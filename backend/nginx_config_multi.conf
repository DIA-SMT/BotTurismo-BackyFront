server {
    listen 80;
    server_name servidoria.smt.gob.ar;

    # Bot de Turismo SMT (Express corriendo en el puerto 3000)
    location /turismo/ {
        proxy_pass http://127.0.0.1:3000/;
        # Fotos y notas de voz del chat web de Migue (base64, hasta ~9 MB)
        client_max_body_size 10m;
        # El backend corta a los 75 s; el default de nginx (60 s) llegaría antes
        proxy_read_timeout 90s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Bot de Ambiente Tucumán (Express corriendo en el puerto 3001)
    location /ambiente/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
